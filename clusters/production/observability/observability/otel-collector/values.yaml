# open-telemetry/opentelemetry-collector — shared values.
# The one endpoint every app points at (OTEL_EXPORTER_OTLP_ENDPOINT =
# http://otel-collector.observability.svc.cluster.local:4318). Traces go to
# Tempo over OTLP/gRPC; metrics go to the Prometheus-compatible store's OTLP
# endpoint (Prometheus in develop, Mimir in cloud — same path).
fullnameOverride: otel-collector
mode: deployment
replicaCount: 1

image:
  repository: otel/opentelemetry-collector-contrib

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Only OTLP in. The chart's jaeger/zipkin/prometheus receivers (and their
# ports) are switched off.
ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false

config:
  receivers:
    jaeger: null
    zipkin: null
    prometheus: null
    # The chart already binds otlp grpc/http to the pod IP on 4317/4318.
  processors:
    batch: {}
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25
    # Kubelet probes trace as single-span traces and would drown real traffic
    # in Tempo search. The apps set http.route on their request spans.
    filter/health:
      error_mode: ignore
      traces:
        span:
          - 'attributes["http.route"] == "/health"'
          - 'name == "GET /health"'
  exporters:
    debug: null
    otlp/tempo:
      endpoint: tempo.observability.svc.cluster.local:4317
      tls:
        insecure: true
    otlphttp/metrics:
      endpoint: http://prometheus.observability.svc.cluster.local:9090/api/v1/otlp
  service:
    pipelines:
      logs: null
      traces:
        receivers: [otlp]
        processors: [memory_limiter, filter/health, batch]
        exporters: [otlp/tempo]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlphttp/metrics]
