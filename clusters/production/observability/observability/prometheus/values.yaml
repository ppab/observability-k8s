# prometheus-community/prometheus — shared values.
# A single Prometheus server ingesting OTLP from the collector
# (--web.enable-otlp-receiver, /api/v1/otlp/v1/metrics). Mimir serves the same
# OTLP path and PromQL, so cloud overlays swap the store without touching the
# collector pipeline or the dashboards.
alertmanager:
  enabled: false
kube-state-metrics:
  enabled: false
prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false

server:
  fullnameOverride: prometheus
  # The list replaces the chart default, so keep web.enable-lifecycle.
  extraFlags:
    - web.enable-lifecycle
    - web.enable-otlp-receiver
  otlp:
    # Surface these resource attributes as plain labels (service_name, …)
    # instead of only on target_info.
    promote_resource_attributes:
      - service.name
      - service.version
      - service.instance.id
  tsdb:
    # OTLP pushes arrive batched and slightly late; accept them.
    out_of_order_time_window: 30m
  global:
    scrape_interval: 15s
  service:
    servicePort: 9090

# Drops the chart's Kubernetes service-discovery jobs (they need RBAC this
# slice has no use for). The apps push; only Prometheus itself and the
# collector's internal metrics are scraped.
scrapeConfigs: null

serverFiles:
  prometheus.yml:
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: [localhost:9090]
      - job_name: otel-collector
        static_configs:
          - targets: [otel-collector.observability.svc.cluster.local:8888]
