apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - release.yaml
# Alerting provisioning lives beside the release as Helm values fragments;
# the HelmRelease merges them through `valuesFrom`.
configMapGenerator:
  - name: grafana-alerting-values
    files:
      - connectivity-rules.yaml=alerting/connectivity-rules.yaml
      - connectivity-notifications.yaml=alerting/connectivity-notifications.yaml
  # Dashboards: one ConfigMap per provider, mounted by the chart at
  # /var/lib/grafana/dashboards/<provider> (see dashboardsConfigMaps in release.yaml).
  - name: grafana-dashboards-connectivity
    files:
      - connectivity.json=dashboards/connectivity.json
generatorOptions:
  disableNameSuffixHash: true
