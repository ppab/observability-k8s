apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: observability
spec:
  interval: 30m
  dependsOn:
    - name: prometheus
    - name: tempo
  chart:
    spec:
      chart: grafana
      version: ">=13.0.0 <14.0.0"
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: observability
      interval: 1h
  # Alert rules, contact points and policies are provisioned as code from
  # alerting/*.yaml (see kustomization.yaml); each file is a values fragment.
  valuesFrom:
    - kind: ConfigMap
      name: grafana-alerting-values
      valuesKey: connectivity-rules.yaml
  values:
    fullnameOverride: grafana

    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            uid: prometheus
            type: prometheus
            access: proxy
            url: http://prometheus.observability.svc.cluster.local:9090
            isDefault: true
          - name: Tempo
            uid: tempo
            type: tempo
            access: proxy
            url: http://tempo.observability.svc.cluster.local:3200
            jsonData:
              tracesToMetrics:
                datasourceUid: prometheus
              serviceMap:
                datasourceUid: prometheus
              nodeGraph:
                enabled: true

    # Dashboards as code: dashboards/*.json, one provider (= one ConfigMap) per
    # folder. Provisioned dashboards cannot be saved from the UI; "Save as copy"
    # to experiment, then bring the JSON back here.
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: connectivity
            orgId: 1
            folder: Connectivity
            type: file
            disableDeletion: true
            editable: true
            allowUiUpdates: false
            options:
              path: /var/lib/grafana/dashboards/connectivity
    dashboardsConfigMaps:
      connectivity: grafana-dashboards-connectivity

    ingress:
      enabled: true
      ingressClassName: traefik
      hosts:
        - grafana.monitorapp.io
        - grafana.monitorapp.internal

    grafana.ini:
      server:
        root_url: https://grafana.monitorapp.io
      analytics:
        check_for_updates: false
        reporting_enabled: false
