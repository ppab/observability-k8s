apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-collector
  namespace: observability
spec:
  interval: 30m
  dependsOn:
    - name: prometheus
    - name: tempo
  chart:
    spec:
      chart: opentelemetry-collector
      version: ">=0.80.0 <1.0.0"
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: observability
      interval: 1h
  values:
    fullnameOverride: otel-collector
    mode: deployment
    replicaCount: 1

    image:
      repository: otel/opentelemetry-collector-contrib

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

    ports:
      jaeger-compact:
        enabled: false
      jaeger-thrift:
        enabled: false
      jaeger-grpc:
        enabled: false
      zipkin:
        enabled: false

    config:
      receivers:
        jaeger: null
        zipkin: null
        prometheus: null
      processors:
        batch: {}
        memory_limiter:
          check_interval: 5s
          limit_percentage: 80
          spike_limit_percentage: 25
        filter/health:
          error_mode: ignore
          traces:
            span:
              - 'attributes["http.route"] == "/health"'
              - 'name == "GET /health"'
      exporters:
        debug: null
        otlp/tempo:
          endpoint: tempo.observability.svc.cluster.local:4317
          tls:
            insecure: true
        otlphttp/metrics:
          endpoint: http://prometheus.observability.svc.cluster.local:9090/api/v1/otlp
      service:
        pipelines:
          logs: null
          traces:
            receivers: [otlp]
            processors: [memory_limiter, filter/health, batch]
            exporters: [otlp/tempo]
          metrics:
            receivers: [otlp]
            processors: [memory_limiter, batch]
            exporters: [otlphttp/metrics]
