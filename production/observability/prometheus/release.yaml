apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: observability
spec:
  interval: 30m
  chart:
    spec:
      chart: prometheus
      version: ">=25.0.0 <26.0.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: observability
      interval: 1h
  values:
    alertmanager:
      enabled: false
    kube-state-metrics:
      enabled: false
    prometheus-node-exporter:
      enabled: false
    prometheus-pushgateway:
      enabled: false

    server:
      fullnameOverride: prometheus
      extraFlags:
        - web.enable-lifecycle
        - web.enable-otlp-receiver
      otlp:
        promote_resource_attributes:
          - service.name
          - service.version
          - service.instance.id
      tsdb:
        out_of_order_time_window: 30m
      global:
        scrape_interval: 15s
      service:
        servicePort: 9090

    scrapeConfigs: null

    serverFiles:
      prometheus.yml:
        scrape_configs:
          - job_name: prometheus
            static_configs:
              - targets: ["localhost:9090"]
          - job_name: otel-collector
            static_configs:
              - targets: ["otel-collector.observability.svc.cluster.local:8888"]
