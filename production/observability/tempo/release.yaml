apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: observability
spec:
  interval: 30m
  chart:
    spec:
      chart: tempo
      version: ">=1.0.0 <2.0.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: observability
      interval: 1h
  values:
    fullnameOverride: tempo
    tempo:
      reportingEnabled: false
      metricsGenerator:
        enabled: false
